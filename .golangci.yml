version: "2"

linters:
  default: standard
  enable:
    - asasalint
    - bidichk
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - errorlint
    - exhaustive
    - gocognit
    - gocritic
    - makezero
    - modernize
    - nilerr
    - nolintlint
    - reassign
    - recvcheck
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - unparam
    - usestdlibvars
    - usetesting
    - wsl_v5
  settings:
    depguard:
      rules:
        # pkg/epub and pkg/library are standalone libraries, so they carry no
        # ebookfs concept. Domain-free utilities are fine. Third-party modules
        # are listed since each one becomes a dependency of every importer.
        public-libraries:
          files:
            - "**/pkg/**"
          allow:
            - $gostd
            - github.com/ramblingenzyme/ebookfs/pkg
            - github.com/ramblingenzyme/ebookfs/internal/atomicfs
            - github.com/ramblingenzyme/ebookfs/internal/util
            # TODO: drop once the library owns its domain model (TODO.md,
            # Boundaries).
            - github.com/ramblingenzyme/ebookfs/internal/book
            - github.com/ramblingenzyme/ebookfs/internal/testing
            - github.com/BurntSushi/toml
            - github.com/beevik/etree
            - modernc.org/sqlite
    exhaustive:
      default-signifies-exhaustive: true
    gocognit:
      min-complexity: 15
    sloglint:
      kv-only: true
      key-naming-case: snake
      # A value built into the message splits one event across many messages.
      static-msg: true
    wsl_v5:
      # Keeps a group of related statements together and puts the blank line
      # above the block, where the default splits the group.
      enable:
        - cuddle-group
    nolintlint:
      require-explanation: true
      require-specific: true
    errcheck:
      exclude-functions:
        # Always returns nil.
        - (*github.com/ramblingenzyme/go9p/fs.StaticDir).DeleteChild
        # Cleanup calls the std-error-handling preset below misses.
        - (*os.Root).Remove
        - (*github.com/ramblingenzyme/ebookfs/internal/testing/ninep.Fid).Clunk
    staticcheck:
      # staticcheck's defaults, plus QF1008. Selectors such as
      # d.StaticDir.AddChild name the embedded type on purpose.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1008
  exclusions:
    presets:
      # Close and Remove on cleanup paths. Write paths check Close explicitly.
      - std-error-handling
    rules:
      # A table-driven test is long by design.
      - path: (_test\.go|internal/testing/)
        linters:
          - cyclop
          - gocognit

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
