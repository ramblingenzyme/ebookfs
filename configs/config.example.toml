[library]
root = "/var/lib/ebookfs/library"
inbox_temp = "/var/lib/ebookfs/library/.inbox-tmp"  # must be on same filesystem as root
index_path = "/var/lib/ebookfs/library/.index.db"

[reader]
# The reader/ directory is an rsync source for an e-reader: books in the listed
# reading statuses, grouped by author.
statuses = ["unread", "reading"]  # subset of unread | reading | read | abandoned
# Convert epubs to Kobo's kepub format on the way out. false serves the original
# epub (works on any e-reader); true converts and caches per book.
convert = false
# Where converted kepubs are cached. MUST be outside library.root so the library
# walk never treats cached files as books. Only used when convert = true.
cache_dir = "/var/lib/ebookfs/kepub-cache"

[search]
# handle_ttl controls how long a search handle lives without activity before the
# cleanup worker reclaims it. Set to "0s" to disable TTL-based cleanup.
handle_ttl = "30m"
# max_handles caps concurrent search handles; the oldest (by last query time) are
# evicted when the limit is exceeded. Set to 0 to disable max-handle eviction.
max_handles = 100

[server]
listen = "0.0.0.0:5640"
# "none" is the only implemented mode; "shared-secret" is reserved and rejected
# at startup until it is wired into the 9P server.
auth = "none"

[opds]
# An OPDS 1.2 / 2.0 catalog of the whole library, read-only, for ebook reader
# apps (KOReader, Moon+ Reader, Thorium). Mounted at /opds.
# An empty listen means no catalog and no open port; this is the default.
listen = ""  # e.g. "0.0.0.0:8080"
# The catalog's canonical absolute URL. Set it whenever the catalog is reachable
# from outside this host: without it the absolute URLs in served documents come
# from the client's own Host and X-Forwarded-* headers.
base_url = ""  # e.g. "https://books.example.com"
# The catalog's own rendition choice, separate from [reader]: reader/ is rsynced
# to one known device, while the catalog serves whichever app holds the URL.
# false serves the original epub, which is what a generic OPDS client wants;
# kepub is Kobo's format. Conversions land in reader.cache_dir either way, so a
# book converted for one half is already converted for the other.
convert = false

[log]
level = "info"   # debug | info | warn | error
format = "text"  # text | json
