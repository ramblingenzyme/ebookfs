[library]
root = "/var/lib/ebookfs/library"
inbox_temp = "/var/lib/ebookfs/library/.inbox-tmp"  # must be on same filesystem as root
index_path = "/var/lib/ebookfs/library/.index.db"

[reader]
# The reader/ directory is an rsync source for an e-reader: books in the listed
# reading statuses, grouped by author.
statuses = ["unread", "reading"]  # subset of unread | reading | read | abandoned
# Convert epubs to Kobo's kepub format on the way out. false serves the original
# epub (works on any e-reader); true converts and caches per book in .sidecar/.
convert = false

[search]
# handle_ttl controls how long a search handle lives without activity before the
# cleanup worker reclaims it. Set to "0s" to disable TTL-based cleanup.
handle_ttl = "30m"
# max_handles caps concurrent search handles; the oldest (by last query time) are
# evicted when the limit is exceeded. Set to 0 to disable max-handle eviction.
max_handles = 100

[server]
listen = "0.0.0.0:5640"
# "none" is the only implemented mode; "shared-secret" is reserved and rejected
# at startup until it is wired into the 9P server.
auth = "none"

[opds]
# Mounted at /opds. An empty listen means no catalog and no open port.
listen = ""  # e.g. "0.0.0.0:8080"
# Without it, absolute URLs in served documents come from the client's own
# Host and X-Forwarded-* headers.
base_url = ""  # e.g. "https://books.example.com"
# Separate from [reader]'s convert: reader/ is rsynced to one known device,
# the catalog serves whichever app holds the URL. Conversions land in each
# book's .sidecar/ directory either way.
convert = false

[log]
level = "info"   # debug | info | warn | error
format = "text"  # text | json
